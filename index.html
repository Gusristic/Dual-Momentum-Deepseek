<script>
// â”€â”€â”€ MODELOS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const MODELS = {
  A: { name: "A Â· Antonacci clÃ¡sico", desc: "12M relative + 12M absolute vs cash", editable: [] },
  B: { name: "B Â· SMA200 (aprox SMA10 mensual)", desc: "Filtro: precio > SMA10 mensual", editable: [] },
  C: { name: "C Â· Blended 6M + 12M (50/50)", desc: "Momentum (R6+R12)/2, filtro 12M > cash", editable: [{k:"w12",label:"Peso 12M",def:0.5},{k:"w6",label:"Peso 6M",def:0.5}] },
  D: { name: "D Â· Multi-rol (adaptado)", desc: "Top-1 por rol entre los que pasan filtro 12M, pesos iguales", editable: [] },
  E: { name: "E Â· Risk parity", desc: "Pesos inversos a volatilidad entre los que pasan filtro 12M", editable: [] },
  F: { name: "F Â· VAA breadth (adaptado)", desc: "Si >50% del universo pasa filtro 12M â†’ top-1 por momentum 12M; si no â†’ cash", editable: [{k:"breadth",label:"Umbral breadth (%)",def:50}] },
  G: { name: "G Â· Rebalanceo trimestral", desc: "Igual que A pero solo rebalancea cada 3 meses", editable: [] },
  H: { name: "H Â· Multi-ventana 12M/6M/3M", desc: "Pesos editables, filtro estricto o 12M, top-1", editable: [{k:"w12",label:"Peso 12M",def:0.5},{k:"w6",label:"Peso 6M",def:0.3},{k:"w3",label:"Peso 3M",def:0.2},{k:"threshold",label:"Umbral rotaciÃ³n (ej. 0.005 = 0.5%)",def:0.005}] },
};

const DEFAULT_CONFIG = {
  model: "H",
  rebalance: "monthly",
  params: {
    A: {}, B: {}, D: {}, E: {}, G: {},
    C: { w12: 0.5, w6: 0.5 },
    F: { breadth: 50 },
    H: { w12: 0.5, w6: 0.3, w3: 0.2, threshold: 0.005 },
  },
};

let CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
try {
  const saved = localStorage.getItem("dm_config");
  if (saved) CONFIG = Object.assign(CONFIG, JSON.parse(saved));
} catch(e) {}

// â”€â”€â”€ DATOS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const CASH = "0P00000F24.F";
const RISK = ["0P0001CLDM.F","0P0001CJGN.F","0P0001CLDI.F","0P0001AN9J.F","0P0001AINL.F","0P0000Y354.F","0P00012I66.F"];
let RAW = null, MONTHLY = null;
const main = document.getElementById("main");
let chartRef = null;

function buildAlignedMatrix(data){const allMonths=new Set();for(const obj of Object.values(data)){if(!obj.dates)continue;for(const d of obj.dates)allMonths.add(d.slice(0,7));}const months=[...allMonths].sort();const idxMap=new Map(months.map((m,i)=>[m,i]));const matrix={};for(const [ticker,obj] of Object.entries(data)){if(!obj.dates)continue;const row=new Array(months.length).fill(null);for(let k=0;k<obj.dates.length;k++){const m=obj.dates[k].slice(0,7);const idx=idxMap.get(m);if(idx!==undefined)row[idx]=obj.close[k];}matrix[ticker]={dates:months,close:row,meta:obj.meta};}return matrix;}
async function loadData(){
  document.getElementById("meta").textContent = "Cargando datosâ€¦";
  try {
    const r = await fetch("data/prices.json", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    RAW = await r.json();
    MONTHLY = buildAlignedMatrix(RAW.data);
    const w = RAW.generated_at ? new Date(RAW.generated_at).toLocaleString("es-ES") : "â€”";
    document.getElementById("meta").innerHTML = Object.keys(RAW.data).length + " instrumentos<br>Actualizado: " + w;
    show("signal");
  } catch (e) {
    document.getElementById("meta").textContent = "Error: " + e.message;
    main.innerHTML = '<div class="p-6 bg-red-50 text-red-800 rounded"><strong>No se han podido cargar los datos.</strong></div>';
  }
}

// â”€â”€â”€ HELPERS MOMENTUM â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function momentum(t, i, w) {
  const s = MONTHLY[t];
  if (!s || i - w < 0) return null;
  const p0 = s.close[i - w], p1 = s.close[i];
  if (p0 === null || p1 === null || p0 === undefined || p1 === undefined) return null;
  return p1 / p0 - 1;
}
function vol(t, i, w) {
  const s = MONTHLY[t];
  if (!s || i - w < 1) return null;
  const rets = [];
  for (let k = i - w + 1; k <= i; k++) {
    const p0 = s.close[k-1], p1 = s.close[k];
    if (p0 !== null && p1 !== null && p0 && p1) rets.push(p1/p0 - 1);
  }
  if (rets.length < 3) return null;
  const m = rets.reduce((a,b) => a+b, 0) / rets.length;
  const v = rets.reduce((a,b) => a + (b-m)**2, 0) / rets.length;
  return Math.sqrt(v);
}
function sma(t, i, w) {
  const s = MONTHLY[t];
  if (!s || i - w + 1 < 0) return null;
  let sum = 0, n = 0;
  for (let k = i - w + 1; k <= i; k++) {
    const p = s.close[k];
    if (p !== null && p !== undefined) { sum += p; n++; }
  }
  return n === 0 ? null : sum / n;
}

// â”€â”€â”€ MOTORES DE CADA MODELO â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
// Cada motor devuelve: { date, month_index, weights: {ticker: w}, breakdown: {...} }
function computeA(params, rebalance) {
  const cash = MONTHLY[CASH]; if (!cash) return [];
  const N = cash.close.length; const out = []; let current = null;
  for (let i = 12; i < N; i++) {
    const c12 = momentum(CASH, i, 12);
    if (c12 === null) continue;
    const cands = [];
    for (const t of RISK) {
      const r12 = momentum(t, i, 12);
      if (r12 === null) continue;
      cands.push({ ticker: t, r12, passes: r12 > c12 });
    }
    const elig = cands.filter(c => c.passes).sort((a,b) => b.r12 - a.r12);
    const target = elig.length > 0 ? elig[0].ticker : null;
    current = target;
    out.push({ date: cash.dates[i], month_index: i, current, candidates: cands, cash12: c12 });
  }
  return out;
}
function computeB(params, rebalance) {
  const cash = MONTHLY[CASH]; if (!cash) return [];
  const N = cash.close.length; const out = []; let current = null;
  for (let i = 12; i < N; i++) {
    const cands = [];
    for (const t of RISK) {
      const r12 = momentum(t, i, 12);
      const price = MONTHLY[t]?.close[i];
      const m10 = sma(t, i, 10);
      if (r12 === null || price === null || m10 === null) continue;
      cands.push({ ticker: t, r12, passes: price > m10 });
    }
    const elig = cands.filter(c => c.passes).sort((a,b) => b.r12 - a.r12);
    const target = elig.length > 0 ? elig[0].ticker : null;
    current = target;
    out.push({ date: cash.dates[i], month_index: i, current, candidates: cands });
  }
  return out;
}
function computeC(params, rebalance) {
  const cash = MONTHLY[CASH]; if (!cash) return [];
  const N = cash.close.length; const out = []; let current = null;
  const w12 = params.w12 ?? 0.5, w6 = params.w6 ?? 0.5;
  for (let i = 12; i < N; i++) {
    const c12 = momentum(CASH, i, 12);
    if (c12 === null) continue;
    const cands = [];
    for (const t of RISK) {
      const r12 = momentum(t, i, 12); const r6 = momentum(t, i, 6);
      if (r12 === null || r6 === null) continue;
      const M = w12 * r12 + w6 * r6;
      cands.push({ ticker: t, r12, r6, M, passes: r12 > c12 });
    }
    const elig = cands.filter(c => c.passes).sort((a,b) => b.M - a.M);
    const target = elig.length > 0 ? elig[0].ticker : null;
    current = target;
    out.push({ date: cash.dates[i], month_index: i, current, candidates: cands, cash12: c12 });
  }
  return out;
}
function computeD() {
  // Adaptado: todos los que pasan filtro 12M, pesos iguales entre ellos
  const cash = MONTHLY[CASH]; if (!cash) return [];
  const N = cash.close.length; const out = [];
  for (let i = 12; i < N; i++) {
    const c12 = momentum(CASH, i, 12);
    if (c12 === null) continue;
    const cands = [];
    for (const t of RISK) {
      const r12 = momentum(t, i, 12);
      if (r12 === null) continue;
      cands.push({ ticker: t, r12, passes: r12 > c12 });
    }
    const elig = cands.filter(c => c.passes);
    const weights = {};
    if (elig.length === 0) { weights[CASH] = 1; }
    else { elig.forEach(c => weights[c.ticker] = 1 / elig.length); }
    out.push({ date: cash.dates[i], month_index: i, weights, current: null, candidates: cands, cash12: c12, multi: true });
  }
  return out;
}
function computeE() {
  const cash = MONTHLY[CASH]; if (!cash) return [];
  const N = cash.close.length; const out = [];
  for (let i = 12; i < N; i++) {
    const c12 = momentum(CASH, i, 12);
    if (c12 === null) continue;
    const cands = [];
    for (const t of RISK) {
      const r12 = momentum(t, i, 12); const v = vol(t, i, 12);
      if (r12 === null || v === null || v === 0) continue;
      cands.push({ ticker: t, r12, vol: v, passes: r12 > c12 });
    }
    const elig = cands.filter(c => c.passes);
    const weights = {};
    if (elig.length === 0) { weights[CASH] = 1; }
    else {
      const invVols = elig.map(c => 1 / c.vol);
      const sumInv = invVols.reduce((a,b) => a+b, 0);
      elig.forEach((c, k) => weights[c.ticker] = invVols[k] / sumInv);
    }
    out.push({ date: cash.dates[i], month_index: i, weights, current: null, candidates: cands, cash12: c12, multi: true });
  }
  return out;
}
function computeF(params) {
  const cash = MONTHLY[CASH]; if (!cash) return [];
  const N = cash.close.length; const out = [];
  const threshold = (params.breadth ?? 50) / 100;
  for (let i = 12; i < N; i++) {
    const c12 = momentum(CASH, i, 12);
    if (c12 === null) continue;
    const cands = [];
    for (const t of RISK) {
      const r12 = momentum(t, i, 12);
      if (r12 === null) continue;
      cands.push({ ticker: t, r12, passes: r12 > c12 });
    }
    const passCount = cands.filter(c => c.passes).length;
    const breadth = cands.length > 0 ? passCount / cands.length : 0;
    let target = null;
    if (breadth >= threshold) {
      const elig = cands.filter(c => c.passes).sort((a,b) => b.r12 - a.r12);
      target = elig.length > 0 ? elig[0].ticker : null;
    }
    out.push({ date: cash.dates[i], month_index: i, current: target, candidates: cands, breadth, cash12: c12 });
  }
  return out;
}
function computeG() {
  const signals = computeA({}, "quarterly");
  // Aplicar rebalanceo trimestral: mantener posiciÃ³n 3 meses
  const out = [];
  let lastRotationIdx = -1;
  let current = null;
  signals.forEach((s, i) => {
    const monthsSinceLastRotation = i - lastRotationIdx;
    const shouldRotate = lastRotationIdx === -1 || monthsSinceLastRotation >= 3 || s.current === null;
    if (shouldRotate) {
      current = s.current;
      if (s.current !== (out[i-1]?.current ?? null)) lastRotationIdx = i;
    }
    out.push({ ...s, current });
  });
  return out;
}
function computeH(params) {
  const cash = MONTHLY[CASH]; if (!cash) return [];
  const N = cash.close.length; const out = []; let cur = null;
  const w12 = params.w12 ?? 0.5, w6 = params.w6 ?? 0.3, w3 = params.w3 ?? 0.2;
  const thr = params.threshold ?? 0.005;
  const useStrict = params.strict ?? false;
  for (let i = 12; i < N; i++) {
    const c12 = momentum(CASH, i, 12); const c6 = momentum(CASH, i, 6); const c3 = momentum(CASH, i, 3);
    if (c12 === null) continue;
    const cands = [];
    for (const t of RISK) {
      const r12 = momentum(t, i, 12); const r6 = momentum(t, i, 6); const r3 = momentum(t, i, 3);
      if (r12 === null || r6 === null || r3 === null) continue;
      const passes = useStrict ? (r12 > c12 && r6 > c6 && r3 > c3) : (r12 > c12);
      const M = w12 * r12 + w6 * r6 + w3 * r3;
      cands.push({ ticker: t, r12, r6, r3, M, passes });
    }
    const elig = cands.filter(c => c.passes).sort((a,b) => b.M - a.M);
    const tgt = elig.length > 0 ? elig[0].ticker : null;
    let nc = cur;
    if (cur === null) nc = tgt;
    else if (tgt === null) nc = null;
    else if (tgt === cur) nc = cur;
    else {
      const cM = cands.find(c => c.ticker === cur)?.M ?? -Infinity;
      const tM = cands.find(c => c.ticker === tgt)?.M ?? -Infinity;
      nc = (tM - cM > thr) ? tgt : cur;
    }
    cur = nc;
    out.push({ date: cash.dates[i], month_index: i, current: cur, candidates: cands, cash12: c12, cash6: c6, cash3: c3 });
  }
  return out;
}

function computeSignals() {
  const M = CONFIG.model;
  const P = CONFIG.params[M] || {};
  switch (M) {
    case "A": return computeA(P, CONFIG.rebalance);
    case "B": return computeB(P, CONFIG.rebalance);
    case "C": return computeC(P, CONFIG.rebalance);
    case "D": return computeD();
    case "E": return computeE();
    case "F": return computeF(P);
    case "G": return computeG();
    case "H": return computeH(P);
    default: return computeH(P);
  }
}

// â”€â”€â”€ VISTAS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function label(t) { return t === null ? (RAW.data[CASH]?.meta?.name || "Cash") : (RAW.data[t]?.meta?.name || t); }

function renderSignal() {
  const sig = computeSignals();
  if (!sig.length) return "<p>Datos insuficientes.</p>";
  const last = sig[sig.length - 1];
  const info = MODELS[CONFIG.model];
  const isMulti = last.multi;
  return '<h1 class="text-2xl font-bold mb-1">SeÃ±al Hoy</h1>' +
    '<p class="text-sm text-gray-500 mb-2">' + info.name + ' Â· Datos a ' + last.date + '</p>' +
    '<p class="text-xs text-gray-500 mb-6">' + info.desc + '</p>' +
    (isMulti
      ? renderMultiPositions(last)
      : renderSinglePosition(last)) +
    (CONFIG.model === "H" && last.candidates ? renderWindowBreakdown(last) : "") +
    (CONFIG.model === "F" && last.breadth !== undefined ? '<div class="bg-blue-50 border border-blue-200 rounded p-3 mt-4 text-sm"><strong>Breadth:</strong> ' + (last.breadth*100).toFixed(0) + '% del universo pasa el filtro</div>' : "");
}
function renderSinglePosition(last) {
  const dest = last.current === null ? CASH : last.current;
  const isCash = last.current === null;
  return '<div class="mb-4 p-4 rounded border ' + (isCash ? 'bg-red-50 border-red-300' : 'bg-green-50 border-green-300') + '">' +
    '<div class="font-semibold">Destino: ' + label(dest) + '</div>' +
    '<p class="text-sm mt-1">' + (isCash ? "NingÃºn activo supera el filtro. Cartera 100% cash." : "Activo con mayor momentum que pasa el filtro.") + '</p></div>' +
    '<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">' +
    (last.candidates || []).map(c => '<div class="bg-white rounded border p-4 ' + (c.ticker === last.current ? 'ring-2 ring-indigo-500' : '') + '">' +
      '<div class="text-xs text-gray-500">' + (RAW.data[c.ticker]?.meta?.role || "") + '</div>' +
      '<div class="font-medium">' + label(c.ticker) + '</div>' +
      '<div class="text-xs font-mono text-gray-500">' + c.ticker + '</div>' +
      '<div class="text-2xl font-bold mt-2">' + ((c.M ?? c.r12) * 100).toFixed(2) + ' %</div>' +
      '<div class="text-xs text-gray-500">momentum' + (c.M !== undefined ? ' compuesto' : ' 12M') + '</div>' +
      '<div class="mt-2 text-xs">' + (c.passes ? '<span class="text-green-700 font-medium">Pasa filtro</span>' : '<span class="text-red-600 font-medium">No pasa filtro</span>') + '</div>' +
      '</div>').join("") + '</div>';
}
function renderMultiPositions(last) {
  const weights = last.weights || {};
  const entries = Object.entries(weights).sort((a,b) => b[1] - a[1]);
  return '<div class="mb-4 p-4 rounded border bg-indigo-50 border-indigo-300">' +
    '<div class="font-semibold">Cartera ponderada (' + entries.length + ' posiciones)</div></div>' +
    '<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">' +
    entries.map(([t, w]) => '<div class="bg-white rounded border p-4">' +
      '<div class="text-xs text-gray-500">' + (RAW.data[t]?.meta?.role || "") + '</div>' +
      '<div class="font-medium">' + label(t) + '</div>' +
      '<div class="text-2xl font-bold mt-2">' + (w * 100).toFixed(1) + ' %</div></div>').join("") +
    '</div>';
}
function renderWindowBreakdown(last) {
  const top = (last.candidates || []).find(c => c.ticker === last.current) || (last.candidates || [])[0];
  if (!top) return "";
  const wins = [

function renderBacktest() {
  const sig = computeSignals();
  if (sig.length < 2) return "<p>Datos insuficientes.</p>";
  let eq = 1;
  const ser = [{ m: sig[0].date, v: 1 }];
  for (let i = 1; i < sig.length; i++) {
    const prev = sig[i-1], curr = sig[i];
    let ret = 0;
    if (prev.multi) {
      const w = prev.weights || {};
      for (const [t, wt] of Object.entries(w)) {
        const p0 = MONTHLY[t].close[prev.month_index], p1 = MONTHLY[t].close[curr.month_index];
        if (p0 !== null && p1 !== null && p0) ret += wt * (p1/p0 - 1);
      }
    } else {
      const a = prev.current ?? CASH;
      const p0 = MONTHLY[a].close[prev.month_index], p1 = MONTHLY[a].close[curr.month_index];
      ret = p0 !== null && p1 !== null && p0 ? (p1/p0 - 1) : 0;
    }
    eq *= (1 + ret);
    ser.push({ m: curr.date, v: eq });
  }
  const rets = [];
  for (let i = 1; i < ser.length; i++) rets.push(ser[i].v / ser[i-1].v - 1);
  const mean = rets.reduce((a,b) => a+b, 0) / rets.length;
  const varr = rets.reduce((a,b) => a + (b-mean)**2, 0) / rets.length;
  const vol = Math.sqrt(varr) * Math.sqrt(12);
  const cagr = Math.pow(eq, 12/rets.length) - 1;
  const sharpe = vol > 0 ? (mean * 12) / vol : 0;
  let peak = 1, mdd = 0;
  for (const s of ser) { if (s.v > peak) peak = s.v; const dd = (s.v - peak) / peak; if (dd < mdd) mdd = dd; }
  const pos = rets.filter(r => r > 0).length / rets.length;
  setTimeout(() => drawEq(ser), 0);
  return '<h1 class="text-2xl font-bold mb-1">Backtest â€” ' + MODELS[CONFIG.model].name + '</h1>' +
    '<p class="text-sm text-gray-500 mb-6">' + ser[0].m + ' â†’ ' + ser[ser.length-1].m + ' Â· ' + ser.length + ' meses</p>' +
    '<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">' +
    [["CAGR", (cagr*100).toFixed(2) + " %"], ["Volatilidad", (vol*100).toFixed(2) + " %"], ["Sharpe", sharpe.toFixed(2)], ["Max Drawdown", (mdd*100).toFixed(2) + " %"], ["Retorno total", ((eq-1)*100).toFixed(2) + " %"], ["% positivos", (pos*100).toFixed(1) + " %"], ["Meses", ser.length], ["Ratio ret/DD", mdd !== 0 ? (cagr/Math.abs(mdd)).toFixed(2) : "â€”"]]
    .map(m => '<div class="bg-white rounded border p-4"><div class="text-xs text-gray-500">' + m[0] + '</div><div class="text-xl font-bold mt-1">' + m[1] + '</div></div>').join("") + '</div>' +
    '<div class="bg-white rounded border p-4"><h3 class="font-semibold mb-3">Curva de equity (base 1.00)</h3><canvas id="eq" height="100"></canvas></div>';
}

function renderCorrelations() {
  const tick = RISK;
  const rets = {};
  for (const t of tick) {
    const s = MONTHLY[t];
    if (!s || !s.close) continue;
    const a = [];
    for (let i = 1; i < s.close.length; i++) {
      if (s.close[i] !== null && s.close[i-1] !== null) a.push(s.close[i] / s.close[i-1] - 1);
    }
    rets[t] = a;
  }
  const validTicks = tick.filter(t => rets[t] && rets[t].length >= 24);
  const n = validTicks.length > 0 ? Math.min(...validTicks.map(t => rets[t].length)) : 0;
  for (const t of validTicks) rets[t] = rets[t].slice(-n);
  function corr(a, b) {
    const ma = a.reduce((x,y) => x+y, 0) / a.length, mb = b.reduce((x,y) => x+y, 0) / b.length;
    let num = 0, da = 0, db = 0;
    for (let i = 0; i < a.length; i++) { num += (a[i]-ma)*(b[i]-mb); da += (a[i]-ma)**2; db += (b[i]-mb)**2; }
    return num / Math.sqrt(da * db);
  }
  function cell(v) {
    if (v >= 0.7) return "bg-red-600 text-white";
    if (v >= 0.4) return "bg-amber-500 text-white";
    if (v >= 0.1) return "bg-lime-500 text-white";
    if (v >= -0.1) return "bg-gray-200";
    return "bg-blue-500 text-white";
  }
  const short = t => (RAW.data[t]?.meta?.name || t).replace(/Index Fund|UCITS ETF|Fund|\(IE\)|EUR P Acc|Inst Acc EUR|D Acc EUR|Inv EUR Acc|EUR P|Acc EUR|Acc/gi,"").replace(/\s+/g," ").trim();
  return '<h1 class="text-2xl font-bold mb-1">Correlaciones</h1><p class="text-sm text-gray-500 mb-6">Pearson Â· n = ' + n + ' meses</p>' +
    '<div class="bg-white rounded border p-4 overflow-x-auto"><table class="text-xs"><thead><tr><th></th>' +
    validTicks.map(t => '<th class="px-1 py-1 font-normal" style="writing-mode:vertical-rl;height:110px;font-size:10px">' + short(t) + '</th>').join("") + '</tr></thead><tbody>' +
    validTicks.map(a => '<tr><td class="px-2 py-1 text-xs whitespace-nowrap">' + short(a) + '</td>' +
      validTicks.map(b => {
        const v = corr(rets[a], rets[b]);
        return '<td class="px-0.5 py-0.5"><div class="w-12 h-8 rounded flex items-center justify-center font-semibold ' + cell(v) + '">' + v.toFixed(2) + '</div></td>';
      }).join("") + '</tr>').join("") + '</tbody></table></div>';
}

  const rows = [];
